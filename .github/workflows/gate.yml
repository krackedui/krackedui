name: gate
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true
env:
  # CI runners can take more parallel browser pages than a laptop (local default: a quarter of the cores).
  GATE_CONCURRENCY: "8"
  # Names each system must never mention (kept out of the public tree). Repo secret, one per line.
  GATE_CLEAN_DENY_MOTION: ${{ secrets.GATE_CLEAN_DENY_MOTION }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run the gate for every system
        run: |
          status=0
          for dir in systems/*/; do
            name=$(basename "$dir")
            [ -f "systems/$name/registry/package.json" ] || continue
            echo "::group::gate $name"
            npm run gate -- "$name" || status=1
            echo "::endgroup::"
          done
          exit $status
      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-reports
          path: |
            systems/*/GATE.md
            systems/*/gate-report.json
            .scratch/gate/*/visual/
          if-no-files-found: warn
